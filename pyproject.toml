[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dangerbot"
version = "0.1.0"
description = "Twitch song requests with Spotify OAuth and a persistent queue"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.1,<2"]

[project.scripts]
dangerbot = "dangerbot.app:main"

[tool.setuptools.packages.find]
include = ["dangerbot*"]
