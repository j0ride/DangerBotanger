[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dangerbotanger"
version = "0.1.4"
description = "Twitch song requests with Spotify OAuth and a persistent queue"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1.1,<2", "cryptography>=46,<51"]

[project.optional-dependencies]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
dangerbotanger = "dangerbot.app:main"
dangerbotanger-gui = "dangerbot.gui:main"

[tool.setuptools.packages.find]
include = ["dangerbot*"]
